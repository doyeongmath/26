<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>풍문고 급식 포켓</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1a3d2b; --green-mid: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --amber: #f4a261; --cream: #fdf8f0; --card-bg: #ffffff;
    --text-main: #1a1a1a; --border: #e8e4dc; --shadow: 0 4px 15px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--cream); color: var(--text-main); }
  .site-header { background: var(--green-deep); color: #fff; padding: 20px; text-align: center; }
  .header-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .main { max-width: 1200px; margin: 0 auto; padding: 15px; }

  /* 오늘의 급식 섹션 */
  .today-section { margin-bottom: 30px; }
  .today-card { background: var(--card-bg); border: 2px solid var(--green-mid); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
  .today-label { display: inline-block; background: var(--amber); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .today-date { font-size: 20px; font-weight: 800; color: var(--green-deep); margin-bottom: 15px; }
  .today-menu-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .today-item { background: var(--green-pale); padding: 10px; border-radius: 12px; font-weight: 500; text-align: center; font-size: 14px; }

  /* 전체 급식 그리드 */
  .week-title { font-size: 16px; font-weight: 800; color: var(--green-mid); margin: 30px 0 12px; border-left: 5px solid var(--green-light); padding-left: 12px; }
  .day-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .meal-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 12px; min-height: 200px; }
  .card-date { font-weight: 800; color: var(--green-mid); border-bottom: 1px solid var(--green-pale); padding-bottom: 5px; margin-bottom: 8px; font-size: 14px; }
  .menu-name { font-size: 11.5px; margin-bottom: 3px; color: #444; line-height: 1.4; }
  .holiday { color: #e67e22; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; height: 120px; text-align: center; }

  @media (max-width: 900px) { .day-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-title">🌿 풍문 급식 포켓 (5월)</div>
</header>

<main class="main">
  <section class="today-section" id="today-container"></section>
  <div id="full-menu-container"></div>
</main>

<script>
// 사진 기반 전체 보완 데이터
const MEAL_DATA = [
  { date: '2026-05-04', day: '월', special: '재량휴업일' },
  { date: '2026-05-05', day: '화', special: '어린이날' },
  { date: '2026-05-06', day: '수', menus: ['추가김가루밥', '토마토스파게티', '맛감자&케찹', '불고기화덕피자', '그린샐러드', '사과주스', '오이피클'] },
  { date: '2026-05-07', day: '목', menus: ['문어솥밥&양념장', '소고기무국', '오이송송무침', '떡함박&소스', '총각김치', '무조미김', '유산균 런'] },
  { date: '2026-05-08', day: '금', menus: ['루러우판(돼지덮밥)', '감자옹심이국', '마늘종볶음', '오븐까스&소스', '배추김치', '망고푸딩'] },
  { date: '2026-05-11', day: '월', menus: ['햄깍두기주먹밥', '얼큰어묵국', '오징어&채소튀김', '배추김치', '단무지', '엔요', '투움바밀떡볶이'] },
  { date: '2026-05-12', day: '화', menus: ['칼슘쌀밥', '비름나물', '풍문마라탕', '한우한돈스테이크', '닭꼬치&소스', '배추김치'] },
  { date: '2026-05-13', day: '수', menus: ['나시고랭볶음밥', '쌀국수', '공심채볶음', '양념닭강정', '배추김치', '열대과일샐러드'] },
  { date: '2026-05-14', day: '목', menus: ['찰수수밥', '아욱된장국', '숙주나물무침', '분모자고추장불고기', '뽈락순살구이', '파김치', '모나카아이스'] },
  { date: '2026-05-15', day: '금', menus: ['찰보리밥', '맑은돼지곰탕&당면', '아삭고추쌈장무침', '유린기&소스', '깍두기', '버터바'] },
  { date: '2026-05-18', day: '월', menus: ['오색현미밥', '미역국', '진미채볶음', '버섯소불고기', '대구탕수&타르소스', '배추김치', '말차슈'] },
  { date: '2026-05-19', day: '화', menus: ['찰흑미밥', '삼색달걀국', '상추겉절이', '양념갈비구이', '닭가슴살두부전', '배추김치', '골드키위'] },
  { date: '2026-05-20', day: '수', menus: ['목살필라프', '유부김칫국', '쉬림프샐러드', '모짜치즈볼', '수제닭다리튀김', '배추김치'] },
  { date: '2026-05-21', day: '목', menus: ['찰기장밥', '김치비빔국수', '근대된장국', '족발', '여수갓피클', '깻잎쌈&쌈장'] },
  { date: '2026-05-22', day: '금', menus: ['칼슘쌀밥', '콩나물국', '치자청포묵무침', '치즈닭갈비', '감자채전', '배추김치'] },
  { date: '2026-05-25', day: '월', special: '대체공휴일' },
  { date: '2026-05-26', day: '화', menus: ['찰현미밥', '콩비지찌개', '돈목살김치찜', '돌김자반', '연어구이', '오이소박이'] },
  { date: '2026-05-27', day: '수', menus: ['찹쌀밥', '김치우동', '버터알감자', '골뱅이무침', '치즈돈까스', '깍두기'] },
  { date: '2026-05-28', day: '목', menus: ['북어채무국', '올방개묵무침', '제육덮밥&김가루', '배추김치', '데니쉬핫도그', '크림슨포도'] },
  { date: '2026-05-29', day: '금', menus: ['가쓰오장국', '단호박샐러드', '카오팟볶음밥', '바베큐폭립', '깍두기', '스트링치즈핫바'] }
];

function render() {
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const todayData = MEAL_DATA.find(d => d.date === todayStr);

  const tContainer = document.getElementById('today-container');
  if (todayData) {
    tContainer.innerHTML = `
      <div class="today-card">
        <span class="today-label">오늘의 점심</span>
        <div class="today-date">${todayData.date} (${todayData.day})</div>
        <div class="today-menu-list">
          ${todayData.special ? `<div style="grid-column:1/-1; font-weight:bold; color:#e67e22;">오늘은 ${todayData.special}입니다.</div>` 
          : todayData.menus.map(m => `<div class="today-item">${m}</div>`).join('')}
        </div>
      </div>`;
  } else {
    tContainer.innerHTML = `<div class="today-card" style="text-align:center; color:#999;">오늘의 급식 정보가 없습니다.</div>`;
  }

  const fContainer = document.getElementById('full-menu-container');
  let fullHtml = '';
  const weekTitles = ['1주차', '2주차', '3주차', '4주차'];
  
  for(let i=0; i<4; i++) {
    fullHtml += `<div class="week-title">${weekTitles[i]}</div><div class="day-grid">`;
    const weekData = MEAL_DATA.slice(i*5, (i+1)*5);
    weekData.forEach(d => {
      fullHtml += `
        <div class="meal-card">
          <div class="card-date">${d.date.split('-')[2]}일 (${d.day})</div>
          ${d.special ? `<div class="holiday">${d.special}</div>` 
          : d.menus.map(m => `<div class="menu-name">${m}</div>`).join('')}
        </div>`;
    });
    fullHtml += `</div>`;
  }
  fContainer.innerHTML = fullHtml;
}
render();
</script>
</body>
</html>
