<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>6월 급식표 — 풍문고등학교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1a3d2b; --green-mid: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --amber: #f4a261; --amber-dark: #e76f51; --cream: #fdf8f0; --card-bg: #ffffff;
    --text-main: #1a1a1a; --text-sub: #555; --text-muted: #bbb;
    --border: #e8e4dc; --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-hover: 0 8px 32px rgba(0,0,0,0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--cream); color: var(--text-main); min-height: 100vh; -webkit-text-size-adjust: 100%; }

  /* ── 헤더 ── */
  .site-header { background: var(--green-deep); color: #fff; padding: clamp(16px,4vw,28px) clamp(16px,4vw,32px) clamp(14px,3vw,22px); position: relative; overflow: hidden; }
  .site-header::before { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; background: radial-gradient(circle, rgba(82,183,136,0.25) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
  .header-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
  .header-label { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--green-light); font-weight: 500; margin-bottom: 4px; }
  .header-title { font-size: clamp(22px,6vw,30px); font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; }
  .header-title span { color: var(--amber); }
  .header-sub { font-size: clamp(11px,2.8vw,12px); color: rgba(255,255,255,0.45); margin-top: 4px; font-weight: 300; }

  /* ── 인쇄 바 ── */
  .print-bar { background: var(--green-deep); border-top: 1px solid rgba(255,255,255,0.08); padding: 10px clamp(12px,3vw,24px); }
  .print-bar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .print-bar-info { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 300; }
  .btn-print { background: var(--amber); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: background 0.2s; }
  .btn-print:hover { background: var(--amber-dark); }

  /* ── 본문 ── */
  .main { max-width: 1100px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,28px) 60px; }

  /* ════ 오늘의 급식 카드 ════ */
  .today-section { margin-bottom: 32px; }
  .today-outer {
    background: var(--card-bg); border: 2px solid var(--green-mid);
    border-radius: 20px; padding: 20px 22px; box-shadow: 0 4px 20px rgba(44,106,79,0.12);
  }
  .today-pill {
    display: inline-block; background: var(--amber); color: #fff;
    padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .today-date-row {
    font-size: clamp(18px,4.5vw,22px); font-weight: 900; color: var(--green-deep);
    margin-bottom: 14px; line-height: 1.2;
  }
  .today-date-row span { font-size: clamp(13px,3vw,15px); color: var(--text-muted); font-weight: 400; margin-left: 8px; }
  .today-tiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .today-tile {
    background: var(--green-pale); color: var(--green-deep);
    padding: 7px 14px; border-radius: 20px;
    font-size: clamp(12px,3vw,14px); font-weight: 500; line-height: 1.3;
  }
  .today-tile.is-main {
    background: #fff3e8; color: #c2410c; font-weight: 700;
    border: 1.5px solid #fed7aa;
  }
  .today-tile.is-dessert {
    background: #fff8ef; color: var(--amber-dark); font-weight: 600;
    border: 1.5px solid #fde68a;
  }
  .today-tile.is-rice { background: #f0fdf4; color: #166534; }
  .today-no-data { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px 0; }
  .today-special { font-size: 18px; font-weight: 700; color: #e67e22; padding: 10px 0; }

  /* ── 전체 급식표 ── */
  .week-panel { display: block; }
  .week-panel + .week-panel { margin-top: 10px; }
  .week-title { font-size: clamp(13px,3vw,15px); font-weight: 700; color: var(--green-mid); border-left: 4px solid var(--green-light); padding-left: 10px; margin-bottom: 8px; }

  /* ── 그리드 ── */
  .day-headers { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 6px; }
  .day-header { text-align: center; padding: 6px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--green-mid); border-bottom: 2px solid var(--green-pale); }
  .day-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }

  /* ── 카드 ── */
  .meal-card, .exam-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: box-shadow 0.2s, transform 0.2s; display: flex; flex-direction: column; }
  .meal-card:hover, .exam-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-date-bar { background: linear-gradient(135deg, var(--green-mid), var(--green-light)); color: #fff; padding: clamp(7px,2vw,10px) clamp(10px,2.5vw,14px) clamp(6px,1.5vw,8px); display: flex; align-items: baseline; gap: 5px; flex-shrink: 0; }
  .exam-card .card-date-bar { background: linear-gradient(135deg,#c2410c,#f97316); }
  .special-card .card-date-bar { background: linear-gradient(135deg,#15803d,#4ade80); }
  .card-date-num { font-size: clamp(18px,4.5vw,22px); font-weight: 900; line-height: 1; }
  .card-date-day { font-size: clamp(10px,2.5vw,11px); font-weight: 500; opacity: 0.85; }
  .card-badge { margin-left: auto; background: rgba(255,255,255,0.22); border-radius: 5px; padding: 2px 6px; font-size: clamp(9px,2vw,10px); font-weight: 700; white-space: nowrap; }
  .card-body { padding: clamp(8px,2vw,11px) clamp(10px,2.5vw,14px); flex: 1; }

  /* ── 오늘 카드 강조 ── */
  .meal-card.today, .exam-card.today { border: 2.5px solid var(--amber); box-shadow: 0 0 0 3px rgba(244,162,97,0.18), var(--shadow-hover); }
  .meal-card.today .card-date-bar, .exam-card.today .card-date-bar { background: linear-gradient(135deg,#b45309,var(--amber)); }
  .today-badge { margin-left: auto; background: rgba(255,255,255,0.9); color: #b45309; border-radius: 5px; padding: 2px 7px; font-size: 9px; font-weight: 800; white-space: nowrap; letter-spacing: 0.5px; }

  /* ── 메뉴 아이템 ── */
  .meal-item { padding: 4px 0 3px; border-bottom: 1px solid #f3f0ea; display: flex; flex-direction: column; gap: 1px; }
  .meal-item:last-child { border-bottom: none; }
  .meal-row { display: flex; align-items: center; gap: 4px; }
  .meal-name { font-size: clamp(11.5px,2.7vw,12.5px); color: var(--text-sub); font-weight: 400; line-height: 1.4; flex: 1; }
  .meal-name.rice { color: #777; font-weight: 500; }
  .meal-item.main-dish { background: #fffbf5; margin: 2px -14px; padding: 5px 14px 4px; border-bottom: 1px solid #f3ede0; }
  .meal-item.main-dish .meal-name { font-size: clamp(12.5px,3vw,13.5px); color: #c2410c; font-weight: 700; }
  .meal-item.dessert-item { background: #fff8ef; margin: 2px -14px 0; padding: 4px 14px; border-bottom: none; }
  .meal-name.dessert { color: var(--amber-dark); font-weight: 600; }
  .al-line { font-size: 9px; color: var(--text-muted); letter-spacing: 0.2px; margin-left: auto; padding-left: 4px; flex-shrink: 0; white-space: nowrap; }

  /* ── 영양 바 ── */
  .nutrition-print { display: none; }
  .nutrition-bar { background: #fafaf8; border-top: 1px solid var(--border); padding: clamp(5px,1.2vw,7px) clamp(10px,2.5vw,14px); }
  .nutrition-rows { display: flex; flex-direction: column; gap: 2px; }
  .nutrition-item { display: flex; align-items: center; gap: 4px; }
  .nutrition-name { font-size: 9px; color: var(--text-muted); width: 30px; flex-shrink: 0; }
  .nutrition-track { flex: 1; height: 3px; background: #ece8e0; border-radius: 2px; overflow: hidden; min-width: 0; }
  .nutrition-fill { height: 100%; border-radius: 2px; }
  .fill-kcal { background: var(--amber); } .fill-protein { background: var(--green-light); }
  .fill-calcium { background: #74b3ce; } .fill-iron { background: var(--amber-dark); }
  .nutrition-val { font-size: 9px; font-weight: 700; color: var(--text-sub); width: 36px; text-align: right; flex-shrink: 0; }

  /* ── 특수/빈 카드 ── */
  .special-card { background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .special-body { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: clamp(14px,4vw,20px); gap: 5px; }
  .special-icon { font-size: clamp(20px,5vw,26px); }
  .special-text { font-size: clamp(11px,2.8vw,12px); font-weight: 700; color: #16a34a; text-align: center; }
  .empty-card { background: #fafafa; border: 1.5px dashed #e0ddd6; border-radius: 14px; min-height: 100px; display: flex; align-items: center; justify-content: center; color: #ddd; font-size: 18px; }

  /* ── 알레르기 범례 ── */
  .legend { margin-top: 28px; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: clamp(14px,3.5vw,18px); }
  .legend-title { font-size: 11px; font-weight: 700; color: var(--green-mid); margin-bottom: 10px; letter-spacing: 0.5px; }
  .legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 4px 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-sub); }
  .legend-num { font-weight: 700; color: var(--text-muted); width: 18px; flex-shrink: 0; font-size: 10px; }

  /* ── 모바일 ≤479px ── */
  @media (max-width: 479px) {
    .print-bar-info { display: none; }
    .day-headers { display: none; }
    .day-grid { grid-template-columns: 1fr; gap: 8px; }
    .meal-card, .exam-card { flex-direction: row; border-radius: 12px; }
    .card-date-bar { flex-direction: column; align-items: center; justify-content: flex-start; width: 50px; flex-shrink: 0; padding: 10px 5px 8px; gap: 2px; }
    .card-date-num { font-size: 18px; } .card-date-day { font-size: 9px; }
    .card-badge, .today-badge { margin-left: 0; margin-top: 3px; text-align: center; }
    .card-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .card-body { padding: 8px 10px; }
    .meal-item.main-dish { margin: 2px -10px; padding: 5px 10px 4px; }
    .meal-item.dessert-item { margin: 2px -10px 0; padding: 4px 10px; }
    .special-card { flex-direction: row; }
    .special-card .card-date-bar { flex-direction: column; align-items: center; width: 50px; flex-shrink: 0; padding: 10px 5px 8px; }
    .special-body { flex: 1; flex-direction: row; justify-content: flex-start; padding: 12px 14px; gap: 10px; }
    .special-text { font-size: 11px; text-align: left; }
    .empty-card { min-height: 52px; border-radius: 12px; }
    .legend-grid { grid-template-columns: repeat(2,1fr); }
    .today-tiles { gap: 6px; }
    .today-tile { padding: 6px 11px; font-size: 13px; }
  }
  @media (min-width: 480px) and (max-width: 700px) {
    .day-headers { display: none; }
    .day-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
    .card-right { display: contents; }
  }
  @media (min-width: 701px) { .card-right { display: contents; } }

  /* ── 인쇄 ── */
  @media print {
    @page { margin: 6mm 7mm; size: A4 landscape; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: #fff !important; }
    .print-bar, .today-section { display: none !important; }
    .nutrition-rows { display: none !important; }
    .dessert-emoji { display: none !important; }
    .legend { margin-top: 4px !important; padding: 3px 6px !important; border-radius: 4px !important; border-width: 1px !important; background: #fafaf8 !important; }
    .legend-title { font-size: 6.5px !important; margin-bottom: 3px !important; }
    .legend-grid { grid-template-columns: repeat(10, 1fr) !important; gap: 1px 6px !important; }
    .legend-item { font-size: 6px !important; gap: 2px !important; }
    .legend-num { font-size: 6px !important; width: 12px !important; }
    .nutrition-bar { padding: 1px 4px !important; }
    .nutrition-print { display: block !important; font-size: 6px !important; color: #888 !important; padding: 0 !important; line-height: 1.2 !important; }
    .al-line { font-size: 6px !important; color: #aaa !important; }
    .site-header { padding: 3px 10px !important; }
    .site-header::before { display: none; }
    .header-label, .header-sub { display: none !important; }
    .header-title { font-size: 11px !important; line-height: 1 !important; }
    .main { padding: 4px 0 0 !important; }
    .week-panel + .week-panel { margin-top: 2px !important; }
    .week-title { font-size: 7px !important; padding-left: 6px !important; margin-bottom: 3px !important; border-left-width: 2px !important; }
    .day-headers { gap: 2px !important; margin-bottom: 2px !important; display: grid !important; }
    .day-header { font-size: 7px !important; padding: 2px !important; }
    .day-grid { gap: 2px !important; }
    .meal-card, .exam-card, .special-card { box-shadow: none !important; transform: none !important; border-radius: 4px !important; border-width: 1px !important; }
    .meal-card.today, .exam-card.today { border-color: var(--border) !important; box-shadow: none !important; }
    .empty-card { min-height: 20px !important; border-radius: 4px !important; font-size: 9px !important; }
    .card-date-bar { padding: 2px 4px !important; flex-direction: row !important; align-items: center !important; gap: 3px !important; }
    .card-date-num { font-size: 9px !important; }
    .card-date-day { display: none !important; }
    .card-badge, .today-badge { font-size: 5px !important; padding: 1px 3px !important; }
    .card-body { padding: 2px 4px !important; }
    .meal-item { padding: 0.5px 0 !important; border-bottom-color: #f0ece4 !important; }
    .meal-name { font-size: 7.5px !important; line-height: 1.25 !important; }
    .meal-item.main-dish { margin: 0 -4px !important; padding: 1px 4px !important; }
    .meal-item.main-dish .meal-name { font-size: 8px !important; }
    .meal-item.dessert-item { margin: 0 -4px !important; padding: 1px 4px !important; }
    .meal-name.dessert { font-size: 7.5px !important; }
    .special-body { padding: 4px !important; }
    .special-icon { font-size: 11px !important; }
    .special-text { font-size: 6.5px !important; }
  }
</style>
</head>

/* ── 오늘 날짜 ── */
const _now = new Date();
const _y=_now.getFullYear(), _m=_now.getMonth(), _d=_now.getDate();
const TODAY = (_y===2026 && _m===5) ? _d : null; // 6월(0-indexed: 5)

/* ── 오늘 데이터 찾기 ── */
function findToday(){
  for(const wk of WEEKS){
    for(const d of wk.days){
      if(!d.empty && d.date===TODAY) return d;
    }
  }
  return null;
}

/* ── 오늘의 급식 섹션 ── */
function renderTodaySection(){
  const sec = document.getElementById('today-section');
  const now = new Date();
  const dateStr = `2026년 6월 ${now.getDate()}일 (${DAYS[now.getDay()]})`;

  if(!TODAY){
    sec.innerHTML = `<div class="today-outer">
      <span class="today-pill">오늘의 점심</span>
      <div class="today-date-row">${now.getMonth()+1}월 ${now.getDate()}일 <span>급식 정보가 없습니다</span></div>
    </div>`; return;
  }

  const d = findToday();
  if(!d){
    sec.innerHTML = `<div class="today-outer">
      <span class="today-pill">오늘의 점심</span>
      <div class="today-date-row">${dateStr} <span>급식 정보가 없습니다</span></div>
    </div>`; return;
  }

  let tilesHtml = '';
  if(d.special){
    tilesHtml = `<div class="today-special">📢 오늘은 ${d.specialText||'휴일'}입니다</div>`;
  } else if(d.menus){
    tilesHtml = d.menus.map(m=>{
      let cls='today-tile';
      if(m.t==='main') cls+=' is-main';
      else if(m.t==='dessert') cls+=' is-dessert';
      else if(m.t==='rice') cls+=' is-rice';
      return `<div class="${cls}">${m.n}</div>`;
    }).join('');
  }

  sec.innerHTML = `<div class="today-outer">
    <span class="today-pill">🍱 오늘의 점심</span>
    <div class="today-date-row">${dateStr}${d.badge?` <span>${d.badge}</span>`:''}</div>
    <div class="today-tiles">${tilesHtml}</div>
  </div>`;
}

/* ── 알레르기 라인 ── */
function alLine(nums){
  if(!nums||!nums.length) return '';
  return `<span class="al-line">${nums.join('·')}</span>`;
}
function row(m){
  const isMain=m.t==='main', isRice=m.t==='rice', isDessert=m.t==='dessert';
  let cls='meal-item';
  if(isMain) cls='meal-item main-dish';
  if(isDessert) cls='meal-item dessert-item';
  const nameCls=isRice?'meal-name rice':isDessert?'meal-name dessert':'meal-name';
  const prefix=isDessert?`<span class="dessert-emoji" style="font-size:11px;margin-right:2px">🍬</span>`:'';
  return `<div class="${cls}"><div class="meal-row">${prefix}<span class="${nameCls}">${m.n}</span>${alLine(m.al)}</div></div>`;
}
function nutBar(k,p,ca,fe){
  const pct=(v,m)=>Math.min(100,Math.round(v/m*100));
  return `<div class="nutrition-bar"><div class="nutrition-rows">
    <div class="nutrition-item"><span class="nutrition-name">열량</span><div class="nutrition-track"><div class="nutrition-fill fill-kcal" style="width:${pct(k,1100)}%"></div></div><span class="nutrition-val">${k}</span></div>
    <div class="nutrition-item"><span class="nutrition-name">단백질</span><div class="nutrition-track"><div class="nutrition-fill fill-protein" style="width:${pct(p,85)}%"></div></div><span class="nutrition-val">${p}g</span></div>
    <div class="nutrition-item"><span class="nutrition-name">칼슘</span><div class="nutrition-track"><div class="nutrition-fill fill-calcium" style="width:${pct(ca,500)}%"></div></div><span class="nutrition-val">${ca}mg</span></div>
    <div class="nutrition-item"><span class="nutrition-name">철분</span><div class="nutrition-track"><div class="nutrition-fill fill-iron" style="width:${pct(fe,25)}%"></div></div><span class="nutrition-val">${fe}mg</span></div>
  </div><div class="nutrition-print">${k}kcal · 단백 ${p}g · 칼슘 ${ca}mg · 철분 ${fe}mg</div></div>`;
}
function mealCard(d,exam=false){
  const isToday=TODAY===d.date;
  const cls=(exam?'meal-card exam-card':'meal-card')+(isToday?' today':'');
  const badge=isToday?`<span class="today-badge">오늘</span>`:(d.badge?`<span class="card-badge">${d.badge}</span>`:'');
  return `<div class="${cls}"${isToday?' id="today-card"':''}>
    <div class="card-date-bar">
      <span class="card-date-num">${d.date}</span>
      <span class="card-date-day">${d.day}</span>
      ${badge}
    </div>
    <div class="card-right">
      <div class="card-body">${d.menus.map(row).join('')}</div>
      ${d.nut?nutBar(...d.nut):''}
    </div>
  </div>`;
}
function specialCard(d){
  return `<div class="special-card">
    <div class="card-date-bar">
      <span class="card-date-num">${d.date}</span>
      <span class="card-date-day">${d.day}</span>
      ${d.badge?`<span class="card-badge">${d.badge}</span>`:''}
    </div>
    <div class="special-body"><div class="special-icon">${d.icon}</div><div class="special-text">${d.text}</div></div>
  </div>`;
}

function renderCalendar(){
  const app=document.getElementById('app');
  let html='';
  WEEKS.forEach((wk,wi)=>{
    let grid='';
    wk.days.forEach(d=>{
      if(d.empty){ grid+=`<div class="empty-card">—</div>`; return; }
      if(d.examOnly||d.examOnly2){
        const lbl=d.examOnly2?(d.badge||'기말고사 2일'):'중간고사 2일';
        grid+=`<div class="empty-card" style="border-color:#fdba74;background:#fff7ed;flex-direction:column;gap:6px;">
          <div style="font-size:22px">📝</div>
          <div style="font-size:12px;color:#f97316;font-weight:700">${lbl}</div>
          <div style="font-size:10px;color:#fba55a">${d.date}일 ${d.day}</div>
        </div>`; return;
      }
      if(d.special){ grid+=specialCard(d); return; }
      grid+=mealCard(d,!!d.exam);
    });
    const hdrs=wi===0?`<div class="day-headers">
      <div class="day-header">월요일</div><div class="day-header">화요일</div>
      <div class="day-header">수요일</div><div class="day-header">목요일</div>
      <div class="day-header">금요일</div></div>`:'';
    html+=`<section class="week-panel">
      <div class="week-title">${wk.title} <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:4px;">${wk.range}</span></div>
      ${hdrs}<div class="day-grid">${grid}</div>
    </section>`;
  });
  const lgItems=Object.entries(AL).map(([n,name])=>
    `<div class="legend-item"><span class="legend-num">${String(n).padStart(2,'0')}</span><span>${name}</span></div>`
  ).join('');
  html+=`<div class="legend"><div class="legend-title">🔍 알레르기 유발식품</div><div class="legend-grid">${lgItems}</div></div>`;
  app.innerHTML=html;
}

renderTodaySection();
renderCalendar();
